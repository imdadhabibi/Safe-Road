<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f8fc">
  <title>Login Admin — SafeRoad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-wrap{min-height:calc(100vh - 94px);display:grid;place-items:center;padding:35px 20px}
    .login-card{width:min(100%,440px);padding:30px}
    .login-card h1{font-size:29px;letter-spacing:-.8px;margin:8px 0}
    .login-card p{color:var(--mu);font-size:13px}
    .login-field{margin:22px 0}
    .login-field label{display:block;font-weight:750;font-size:13px;margin-bottom:8px}
    .login-field input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px}
    .login-error{color:#bd3044!important;min-height:20px}
    .login-warning{background:#fff8ec;border:1px solid #f6dbad;color:#87520d;padding:12px;border-radius:12px;font-size:11px;line-height:1.5;margin-top:18px}
  </style>
</head>
<body>
<header class="site-header"><div class="container header-inner">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">⛨</span><span><strong>SafeRoad</strong><small>Area administrator</small></span></a>
  <a class="button button-outline" href="index.html">← Kembali ke website</a>
</div></header>
<main class="login-wrap">
  <section class="surface login-card">
    <span class="section-kicker">AREA PETUGAS</span>
    <h1>Login Admin SafeRoad</h1>
    <p>Masuk menggunakan akun petugas yang sudah dibuat dan diberi hak akses admin di Supabase.</p>
    <form id="admin-login" autocomplete="off">
      <div class="login-field"><label for="admin-email">Email petugas</label><input id="admin-email" type="email" required autocomplete="username" placeholder="nama@instansi.go.id"></div>
      <div class="login-field"><label for="admin-password">Kata sandi</label><input id="admin-password" type="password" required autocomplete="current-password" placeholder="Masukkan kata sandi"></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);margin-bottom:18px"><input type="checkbox" id="show-password"> Tampilkan kata sandi</label>
      <button class="button button-primary submit-button" type="submit">Masuk ke Dashboard →</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
    <div class="login-warning"><b>Akses terbatas:</b> akun harus dibuat oleh pengelola Supabase dan memiliki role admin. Tidak tersedia pendaftaran publik.</div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(() => {
  'use strict';
  const form=document.getElementById('admin-login');
  const email=document.getElementById('admin-email');
  const password=document.getElementById('admin-password');
  const error=document.getElementById('login-error');
  const button=form.querySelector('[type="submit"]');
  document.getElementById('show-password').addEventListener('change',e=>password.type=e.target.checked?'text':'password');
  form.addEventListener('submit',async e=>{
    e.preventDefault();error.textContent='';
    if(!window.safeRoadSupabaseConfigured||!window.safeRoadSupabase){
      error.textContent='Supabase belum dikonfigurasi. Periksa js/supabase-config.js.';
      return;
    }
    button.disabled=true;button.textContent='Memeriksa akun…';
    try{
      const {data,error:authError}=await window.safeRoadSupabase.auth.signInWithPassword({
        email:email.value.trim(),password:password.value
      });
      if(authError)throw authError;
      if(data.user?.app_metadata?.role!=='admin'){
        await window.safeRoadSupabase.auth.signOut();
        throw new Error('Akun ini belum diberi hak akses admin SafeRoad.');
      }
      location.href='admin.html';
    }catch(err){
      error.textContent=err.message||'Login gagal. Periksa email dan kata sandi.';
      password.focus();
    }finally{
      button.disabled=false;button.textContent='Masuk ke Dashboard →';
    }
  });
})();
</script>
</body>
</html>
