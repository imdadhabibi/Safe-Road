<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f8fc"><title>Login Admin — SafeRoad</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>.login-wrap{min-height:calc(100vh - 94px);display:grid;place-items:center;padding:35px 20px}.login-card{width:min(100%,440px);padding:30px}.login-card h1{font-size:29px;letter-spacing:-.8px;margin:8px 0}.login-card p{color:var(--mu);font-size:13px}.login-field{margin:18px 0}.login-field label{display:block;font-weight:750;font-size:13px;margin-bottom:8px}.login-field input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px}.login-error{color:#bd3044!important;min-height:20px}</style></head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">⛨</span><span><strong>SafeRoad</strong><small>Area administrator</small></span></a><a class="button button-outline" href="index.html">← Kembali ke website</a></div></header>
<main class="login-wrap"><section class="surface login-card"><span class="section-kicker">AREA PETUGAS</span><h1>Login Admin SafeRoad</h1><p>Masuk menggunakan email dan kata sandi akun admin yang telah didaftarkan oleh pengelola.</p>
<form id="admin-login"><div class="login-field"><label for="admin-email">Email admin</label><input id="admin-email" type="email" required autocomplete="username" placeholder="admin@email.com"></div><div class="login-field"><label for="admin-password">Kata sandi</label><input id="admin-password" type="password" required autocomplete="current-password" placeholder="Kata sandi akun"></div><button class="button button-primary submit-button" type="submit">Masuk ke Dashboard →</button><p class="login-error" id="login-error" role="alert"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script>
document.getElementById('admin-login').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const msg=document.getElementById('login-error');msg.textContent='Memeriksa akun…';try{if(!window.safeRoadSupabaseConfigured)throw new Error('Koneksi Supabase belum tersedia.');const {data,error}=await safeRoadSupabase.auth.signInWithPassword({email:document.getElementById('admin-email').value.trim(),password:document.getElementById('admin-password').value});if(error)throw error;if(data.user?.app_metadata?.role!=='admin'){await safeRoadSupabase.auth.signOut();throw new Error('Akun ini belum memiliki hak admin.');}location.href='admin.html';}catch(err){msg.textContent=err.message||'Login gagal.';}finally{b.disabled=false;}});
</script></body></html>
